services:
  agent:
    container_name: whatsapp_agent
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "redis:127.0.0.1"
    volumes:
      - ./config:/app/config
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
