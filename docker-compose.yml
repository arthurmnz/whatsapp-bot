services:
  agent:
    container_name: whatsapp_agent
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - whatsapp-net

  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - whatsapp-net

volumes:
  redis_data:

networks:
  whatsapp-net:
    driver: host
